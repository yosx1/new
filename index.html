<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b2a5b">
<title>Cold Run Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1468e6;
    --primary-dark: #0b4fb8;
    --primary-soft: #e8f1ff;
    --navy: #0b2a5b;
    --green: #22a447;
    --green-soft: #e3f6e8;
    --red: #e0413a;
    --red-soft: #fde7e6;
    --amber: #c27a00;
    --amber-soft: #fff3d6;
    --orange: #f28c1e;
    --purple: #7b61f0;
    --text: #15233b;
    --muted: #6b778c;
    --line: #e3e8ef;
    --bg: #f3f5f9;
    --card: #ffffff;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(16, 34, 64, .07);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
    background: #dfe4ec;
    color: var(--text);
    font-size: 15px;
    line-height: 1.5;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  svg { display: block; }

  #app {
    max-width: 480px;
    min-height: 100vh;
    margin: 0 auto;
    background: var(--bg);
    position: relative;
    overflow-x: hidden;
    box-shadow: 0 0 40px rgba(0, 0, 0, .08);
  }
  .screen { min-height: 100vh; display: flex; flex-direction: column; }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 8px;
    padding: 14px 16px; background: var(--card);
    border-bottom: 1px solid var(--line);
  }
  .topbar h1 { flex: 1; margin: 0; font-size: 18px; font-weight: 700; text-align: center; }
  .icon-btn {
    width: 40px; height: 40px; border: 0; border-radius: 10px;
    background: transparent; display: grid; place-items: center; color: var(--text);
  }
  .icon-btn:active { background: var(--bg); }
  .icon-btn svg { width: 22px; height: 22px; }
  .flip svg { transform: scaleX(-1); }
  .spacer { width: 40px; }
  .content { flex: 1; padding: 16px; }

  /* ---------- Home ---------- */
  .home {
    background: linear-gradient(180deg, #0d2754 0%, #183a73 45%, #0a1b3b 100%);
    color: #fff; min-height: 100vh; display: flex; flex-direction: column;
  }
  .home-top { display: flex; justify-content: space-between; padding: 14px 12px 0; }
  .home-top .icon-btn { color: #fff; }
  .home-top .icon-btn:active { background: rgba(255, 255, 255, .1); }
  .hero { position: relative; text-align: center; padding: 0 16px 22px; }
  .hero .logo { width: 84px; height: 84px; margin: 0 auto 6px; }
  .hero .plant { font-size: 21px; font-weight: 700; margin: 0; direction: ltr; }
  .hero .company { font-size: 14px; opacity: .85; margin: 0 0 8px; direction: ltr; }
  .hero .skyline { width: 100%; height: 150px; margin-top: 4px; }
  .hero h2 { margin: 10px 0 0; font-size: 26px; font-weight: 700; direction: ltr; }
  .hero h3 { margin: 0; font-size: 19px; font-weight: 500; opacity: .95; direction: ltr; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 4px 14px 24px; }
  .tile {
    border: 0; border-radius: 16px; color: #fff; padding: 20px 10px 16px;
    min-height: 120px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 6px; text-align: center; box-shadow: 0 6px 16px rgba(0, 0, 0, .25);
  }
  .tile svg { width: 38px; height: 38px; margin-bottom: 4px; }
  .tile b { font-size: 15px; font-weight: 600; }
  .tile small { font-size: 12.5px; opacity: .92; direction: ltr; }
  .tile:active { transform: scale(.98); }
  .t-green { background: linear-gradient(160deg, #2fbf57, #1b9a3f); }
  .t-blue { background: linear-gradient(160deg, #2a7ff3, #1460d6); }
  .t-orange { background: linear-gradient(160deg, #f7a23a, #ec7c12); }
  .t-purple { background: linear-gradient(160deg, #8f7af6, #6c50e8); }
  .home-foot { text-align: center; font-size: 12px; opacity: .6; padding: 0 16px 18px; margin-top: auto; }

  /* ---------- Lists / cards ---------- */
  .list { display: flex; flex-direction: column; gap: 10px; }
  .row {
    display: flex; align-items: center; gap: 12px; width: 100%;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 14px; text-align: right; box-shadow: var(--shadow);
  }
  .row:active { background: var(--primary-soft); }
  .row .ico { width: 52px; height: 44px; flex: none; color: var(--navy); }
  .row .ico svg { width: 100%; height: 100%; }
  .row .txt { flex: 1; min-width: 0; }
  .row .txt b { display: block; font-weight: 600; }
  .row .txt small { display: block; color: var(--muted); direction: ltr; text-align: right; }
  .chev { color: var(--muted); flex: none; }
  .chev svg { width: 18px; height: 18px; }

  .progress-wrap { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-size: 13px; color: var(--muted); }
  .progress { flex: 1; height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--green); border-radius: 99px; transition: width .3s; }

  .group { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; box-shadow: var(--shadow); }
  .group-head {
    width: 100%; border: 0; background: #eef2f8; display: flex; align-items: center; gap: 8px;
    padding: 12px 14px; font-weight: 700; text-align: right;
  }
  .group.closed .group-head { background: var(--card); }
  .group-head .gtitle { flex: 1; }
  .group-head .gcount { font-size: 12px; font-weight: 500; color: var(--muted); }
  .group-head .gcount.full { color: var(--green); }
  .group-head svg { width: 18px; height: 18px; color: var(--muted); transition: transform .2s; }
  .group.closed .group-head svg { transform: rotate(180deg); }
  .group.closed .items { display: none; }
  .item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line); }
  .item.focus { outline: 2px solid var(--primary); outline-offset: -2px; border-radius: 10px; background: #f8fbff; }
  .check {
    width: 26px; height: 26px; flex: none; border-radius: 6px; border: 2px solid #b9c2d0;
    background: #fff; display: grid; place-items: center; padding: 0;
  }
  .check svg { width: 16px; height: 16px; color: #fff; }
  .check.on { background: var(--green); border-color: var(--green); }
  .check.skip { background: #fff; border-color: var(--amber); color: var(--amber); font-weight: 700; }
  .item .label { flex: 1; border: 0; background: none; text-align: right; padding: 4px 0; font-size: 14.5px; }
  .item .label small { display: block; font-size: 12px; color: var(--muted); }
  .tag { font-size: 11px; padding: 1px 8px; border-radius: 99px; margin-inline-start: 6px; font-weight: 600; }
  .tag.skip { background: var(--amber-soft); color: var(--amber); }
  .mini { width: 32px; height: 32px; border: 0; background: none; color: var(--primary); display: grid; place-items: center; padding: 0; position: relative; }
  .mini svg { width: 22px; height: 22px; }
  .mini .dot { position: absolute; top: 2px; left: 2px; min-width: 15px; height: 15px; border-radius: 99px; background: var(--green); color: #fff; font-size: 10px; line-height: 15px; }

  .actions { display: flex; gap: 12px; padding: 12px 16px 18px; background: var(--card); border-top: 1px solid var(--line); position: sticky; bottom: 0; }
  .btn {
    flex: 1; border-radius: 12px; padding: 12px 14px; font-weight: 600; font-size: 15.5px;
    border: 1.5px solid var(--primary); background: var(--primary); color: #fff;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn svg { width: 20px; height: 20px; }
  .btn:active { background: var(--primary-dark); }
  .btn.outline { background: #fff; color: var(--primary); }
  .btn.outline:active { background: var(--primary-soft); }
  .btn.green { background: var(--green); border-color: var(--green); }
  .btn.ghost { background: #fff; border-color: var(--line); color: var(--text); }
  .btn.danger { background: #fff; border-color: var(--red); color: var(--red); }
  .btn.block { width: 100%; }
  .btn:disabled { opacity: .5; }

  /* ---------- Item detail ---------- */
  .hint { background: var(--primary-soft); color: #23446f; border-radius: 12px; padding: 12px 14px; font-size: 13.5px; margin-bottom: 14px; }
  .photo-main { position: relative; border-radius: 14px; overflow: hidden; background: #dfe5ee; aspect-ratio: 4/3; display: grid; place-items: center; color: var(--muted); }
  .photo-main img { width: 100%; height: 100%; object-fit: cover; }
  .photo-main .x { position: absolute; top: 10px; left: 10px; width: 32px; height: 32px; border-radius: 99px; border: 0; background: rgba(15, 23, 42, .65); color: #fff; display: grid; place-items: center; }
  .photo-main .x svg { width: 18px; height: 18px; }
  .photo-empty { text-align: center; font-size: 14px; }
  .photo-empty svg { width: 44px; height: 44px; margin: 0 auto 6px; opacity: .6; }
  .thumbs { display: flex; gap: 8px; margin-top: 8px; overflow-x: auto; }
  .thumbs button { width: 58px; height: 58px; flex: none; border-radius: 10px; overflow: hidden; border: 2px solid transparent; padding: 0; background: #ddd; }
  .thumbs button.sel { border-color: var(--primary); }
  .thumbs img { width: 100%; height: 100%; object-fit: cover; }
  .btn-row { display: flex; gap: 12px; margin: 12px 0 18px; }
  .field-label { display: block; color: var(--muted); font-size: 13.5px; margin: 0 0 6px; }
  textarea, input[type=text], input[type=search], input[type=date], select {
    width: 100%; border: 1px solid var(--line); border-radius: 12px; background: var(--card);
    padding: 11px 12px; outline: none; font-size: 15px;
  }
  textarea { min-height: 120px; resize: vertical; }
  textarea:focus, input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(20, 104, 230, .12); }
  .attach { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-top: 10px; font-size: 14px; }
  .attach span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: ltr; text-align: right; }
  .attach svg { width: 20px; height: 20px; color: var(--red); flex: none; }
  .listening { display: flex; align-items: center; gap: 10px; background: var(--red-soft); color: var(--red); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; font-weight: 600; font-size: 14px; }
  .listening i { width: 10px; height: 10px; border-radius: 99px; background: var(--red); animation: pulse 1s infinite; }
  .listening button { margin-inline-start: auto; border: 0; background: var(--red); color: #fff; border-radius: 8px; padding: 4px 12px; }
  @keyframes pulse { 50% { opacity: .25; } }

  /* ---------- Summary ---------- */
  .done-hero { text-align: center; padding: 26px 16px 8px; }
  .done-hero .ok { width: 84px; height: 84px; border-radius: 99px; background: var(--green); margin: 0 auto 12px; display: grid; place-items: center; color: #fff; }
  .done-hero .ok.warn { background: var(--amber); }
  .done-hero .ok svg { width: 48px; height: 48px; }
  .done-hero h2 { margin: 0; font-size: 21px; }
  .done-hero p { margin: 2px 0 0; color: var(--muted); }
  .kv { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 4px 14px; box-shadow: var(--shadow); }
  .kv div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .kv div:last-child { border-bottom: 0; }
  .kv dt { color: var(--muted); font-size: 13.5px; }
  .kv dd { margin: 0; font-weight: 600; text-align: left; }
  .kv .ok-text { color: var(--green); }
  .kv .warn-text { color: var(--amber); }
  .summary-notes { margin-top: 12px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  .soft-btn { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-weight: 600; color: var(--text); box-shadow: var(--shadow); }
  .soft-btn svg { width: 24px; height: 24px; color: var(--primary); }

  /* ---------- History ---------- */
  .search { display: flex; gap: 8px; margin-bottom: 12px; }
  .search .box { flex: 1; position: relative; }
  .search .box svg { position: absolute; top: 50%; left: 12px; width: 18px; height: 18px; transform: translateY(-50%); color: var(--muted); }
  .search input { padding-left: 38px; }
  .filter-btn { width: 46px; border: 1px solid var(--line); background: var(--card); border-radius: 12px; display: grid; place-items: center; color: var(--text); position: relative; }
  .filter-btn svg { width: 20px; height: 20px; }
  .filter-btn.active { border-color: var(--primary); color: var(--primary); }
  .hcard { display: flex; align-items: center; gap: 10px; width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; text-align: right; box-shadow: var(--shadow); }
  .hcard .txt { flex: 1; }
  .hcard b { display: block; font-weight: 600; }
  .hcard small { color: var(--muted); direction: ltr; display: inline-block; }
  .badge { font-size: 12px; font-weight: 600; padding: 3px 12px; border-radius: 99px; flex: none; }
  .badge.complete { background: var(--green-soft); color: var(--green); }
  .badge.incomplete { background: var(--red-soft); color: var(--red); }
  .badge.progress { background: var(--amber-soft); color: var(--amber); }
  .empty { text-align: center; color: var(--muted); padding: 48px 16px; }
  .empty svg { width: 54px; height: 54px; margin: 0 auto 10px; opacity: .5; }

  /* ---------- Sheets / drawer / modal ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(10, 20, 40, .45); z-index: 20; display: flex; justify-content: center; animation: fade .15s; }
  @keyframes fade { from { opacity: 0; } }
  .sheet-wrap { width: 100%; max-width: 480px; display: flex; flex-direction: column; justify-content: flex-end; }
  .sheet { background: var(--card); border-radius: 20px 20px 0 0; padding: 6px 16px 22px; max-height: 88vh; overflow-y: auto; animation: up .2s ease-out; }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  .sheet-head { display: flex; align-items: center; padding: 8px 0 6px; }
  .sheet-head h2 { flex: 1; margin: 0; font-size: 18px; text-align: center; }
  .sheet-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 12px; border: 1px solid var(--line); background: var(--card); border-radius: 12px; margin-top: 10px; text-align: right; font-weight: 500; }
  .sheet-row svg { width: 22px; height: 22px; color: var(--text); flex: none; }
  .sheet-row .blue svg { color: var(--primary); }
  .sheet-row span { flex: 1; }
  .sheet-row .blue, .sheet-row .chev { flex: none; }
  .form-field { margin-top: 12px; }
  .doc { font-size: 14.5px; }
  .doc h4 { margin: 14px 0 6px; font-size: 15px; color: var(--navy); }
  .doc ul, .doc ol { margin: 0; padding-inline-start: 20px; }
  .doc li { margin-bottom: 4px; }
  .doc table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .doc th, .doc td { border: 1px solid var(--line); padding: 6px 8px; text-align: right; }
  .doc th { background: var(--bg); }

  .drawer-wrap { width: 100%; max-width: 480px; display: flex; }
  .drawer { width: 78%; max-width: 330px; background: var(--card); min-height: 100%; padding: 18px 14px; display: flex; flex-direction: column; animation: slide .2s ease-out; }
  @keyframes slide { from { transform: translateX(40px); } }
  .drawer-brand { display: flex; align-items: center; gap: 10px; padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 8px; direction: ltr; }
  .drawer-brand svg { width: 46px; height: 46px; }
  .drawer-brand b { display: block; font-size: 15.5px; }
  .drawer-brand small { color: var(--muted); }
  .drawer-user { font-size: 13px; color: var(--muted); padding: 2px 6px 8px; }
  .nav-item { display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px 8px; border: 0; background: none; text-align: right; border-radius: 10px; font-weight: 500; }
  .nav-item:active { background: var(--bg); }
  .nav-item svg { width: 21px; height: 21px; color: #404b5e; }
  .nav-item.out { margin-top: auto; border-top: 1px solid var(--line); border-radius: 0; padding-top: 16px; }

  .modal-wrap { width: 100%; max-width: 480px; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal { background: var(--card); border-radius: 18px; padding: 18px; width: 100%; max-width: 380px; animation: up .2s ease-out; }
  .modal h3 { margin: 0 0 8px; font-size: 17px; }
  .modal p { margin: 0 0 14px; color: #3e4a5f; font-size: 14.5px; }
  .modal .btn-row { margin: 14px 0 0; }

  .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: #15233b; color: #fff; padding: 10px 18px; border-radius: 99px; font-size: 14px; z-index: 40; animation: fade .2s; max-width: 90vw; text-align: center; }

  .settings .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .settings .card h4 { margin: 0 0 8px; font-size: 15px; }
  .settings .card p { margin: 0 0 10px; color: var(--muted); font-size: 13.5px; }

  #print { display: none; }
  @media print {
    @page { size: A4; margin: 14mm; }
    body { background: #fff; }
    #app, .overlay, .toast { display: none !important; }
    #print { display: block; font-size: 12px; color: #000; }
    #print h1 { font-size: 18px; margin: 0 0 2px; }
    #print .sub { color: #444; margin: 0 0 12px; direction: ltr; text-align: right; }
    #print table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
    #print th, #print td { border: 1px solid #999; padding: 5px 6px; text-align: right; vertical-align: top; }
    #print th { background: #eee; }
    #print .grp td { background: #f4f4f4; font-weight: 700; }
    #print .photos img { width: 120px; height: 90px; object-fit: cover; margin: 2px; }
    #print .sign { display: flex; justify-content: space-between; margin-top: 30px; }
    #print .sign div { width: 45%; border-top: 1px solid #000; padding-top: 4px; text-align: center; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="print"></div>
<input type="file" id="camInput" accept="image/*" capture="environment" hidden>
<input type="file" id="galInput" accept="image/*" multiple hidden>
<input type="file" id="pdfInput" accept="application/pdf" hidden>

<script>
/* ======================= Icons ======================= */
const I = {
  menu: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>',
  bell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  chevL: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
  chevUp: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>',
  close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  checkCircle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M7.5 12.3l3 3 6-6.3"/></svg>',

const $ = (s) => document.querySelector(s);
const app = $('#app');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
const fmtDate = (ts) => { const d = new Date(ts); return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())}`; };
const fmtTime = (ts) => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const dayKey = (ts) => { const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const sectionOf = (id) => SECTIONS.find(s => s.id === id);
const getCl = (id) => db.checklists.find(c => c.id === id);
const titleOf = (cl) => `قائمة فحص ${sectionOf(cl.section).ar} (Cold Run)`;
const itemState = (cl, itemId) => (cl.items[itemId] ||= { state: null, note: '', photos: [], files: [] });

function stats(cl) {
  const items = allItems(sectionOf(cl.section));
  const done = items.filter(i => cl.items[i.id]?.state === 'done').length;
  const skipped = items.filter(i => cl.items[i.id]?.state === 'skipped').length;
  return { total: items.length, done, skipped, pct: Math.round(done / items.length * 100) };
}

let toastTimer;
function toast(msg) {
  document.querySelector('.toast')?.remove();
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 2600);
}

function go(path) { location.hash = path; }
function topbar(title, backTo, right = '<span class="spacer"></span>') {
  return `<header class="topbar">
    <button class="icon-btn" aria-label="رجوع" onclick="go('${backTo}')">${I.back}</button>
    <h1>${esc(title)}</h1>${right}</header>`;
}

/* ======================= Overlays ======================= */
function closeOverlay() { document.querySelector('.overlay')?.remove(); }
function overlay(kind, html) {
  closeOverlay();
  const o = document.createElement('div');
  o.className = 'overlay';
  o.innerHTML = `<div class="${kind}-wrap">${html}</div>`;
  o.addEventListener('click', (e) => { if (e.target === o || e.target === o.firstElementChild) closeOverlay(); });
  document.body.appendChild(o);
  return o;
}
function sheet(title, body) {
  return overlay('sheet', `<div class="sheet" role="dialog" aria-label="${esc(title)}">
    <div class="sheet-head"><span class="spacer"></span><h2>${esc(title)}</h2>
    <button class="icon-btn" aria-label="إغلاق" onclick="closeOverlay()">${I.close}</button></div>${body}</div>`);
}
function confirmBox(title, msg, okLabel, onOk, danger) {
  const o = overlay('modal', `<div class="modal" role="alertdialog"><h3>${esc(title)}</h3><p>${esc(msg)}</p>
    <div class="btn-row"><button class="btn ${danger ? 'danger' : ''}" id="mOk">${esc(okLabel)}</button>
    <button class="btn ghost" onclick="closeOverlay()">إلغاء</button></div></div>`);
  o.querySelector('#mOk').onclick = () => { closeOverlay(); onOk(); };
}
function askName(onDone) {
  const o = overlay('modal', `<div class="modal"><h3>اسم الفني المنفذ</h3><p>يُسجل الاسم في تقرير الفحص.</p>
    <input type="text" id="nameIn" placeholder="مثال: أحمد علي" value="${esc(db.technician)}">
    <div class="btn-row"><button class="btn" id="mOk">متابعة</button><button class="btn ghost" onclick="closeOverlay()">إلغاء</button></div></div>`);
  const inp = o.querySelector('#nameIn'); inp.focus();
  const ok = () => {
    const v = inp.value.trim();
    if (!v) { inp.focus(); return; }
    db.technician = v; persist(); closeOverlay(); onDone();
  };
  o.querySelector('#mOk').onclick = ok;
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') ok(); });
}

function openDrawer() {
  const nav = (icon, label, action, cls = '') => `<button class="nav-item ${cls}" onclick="closeOverlay();${action}">${icon}<span>${label}</span></button>`;
  overlay('drawer', `<nav class="drawer">
    <div class="drawer-brand">${I.logo}<div><b>Karbala Cement Plant</b><small>Delta Company</small></div></div>
    ${db.technician ? `<div class="drawer-user">الفني: ${esc(db.technician)}</div>` : ''}
    ${nav(I.home, 'الصفحة الرئيسية', "go('/')")}

    ${nav(I.file, 'الأدلة الفنية', 'openManuals()')}

    ${nav(I.logout, 'تسجيل الخروج', 'logout()', 'out')}

function prevGroup() { const cl = currentCl(); cl.openGroup = Math.max(0, (cl.openGroup < 0 ? 0 : cl.openGroup) - 1); persist(); render(); window.scrollTo(0, 0); }
function nextGroup() {
  const cl = currentCl(); const n = buildGroups(sectionOf(cl.section)).length;
  const cur = cl.openGroup < 0 ? 0 : cl.openGroup;
  if (cur < n - 1) { cl.openGroup = cur + 1; persist(); render(); window.scrollTo(0, 0); return; }
  const st = stats(cl); const pending = st.total - st.done;
  if (pending > 0) confirmBox('توجد بنود غير منجزة', `${pending} من ${st.total} بند لم يتم إنجازها. سيتم حفظ القائمة كـ "غير مكتملة". هل تريد الإنهاء؟`, 'إنهاء', () => finish(cl));

}

}

/* Voice note → speech-to-text appended to the item's notes */
function startDictation() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('المتصفح لا يدعم التعرف على الصوت – جرّب Chrome'); return; }
  const ctx = itemCtx(); if (!ctx) return;
  recog = new SR();
  recog.lang = 'ar-IQ';
  recog.continuous = true;
  recog.interimResults = false;
  recog.onresult = (e) => {
    const c = itemCtx(); if (!c) return;
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) {
        const t = e.results[i][0].transcript.trim();
        c.s.note = (c.s.note ? c.s.note.trimEnd() + ' ' : '') + t;
      }
    }
    persist();
    const ta = $('#note'); if (ta) ta.value = c.s.note;
  };
  recog.onerror = (e) => { toast(e.error === 'not-allowed' ? 'لم يتم السماح باستخدام الميكروفون' : 'تعذر التعرف على الصوت'); };
  recog.onend = () => { recog = null; if (itemCtx()) render(); };
  try { recog.start(); render(); } catch (e) { recog = null; toast('تعذر تشغيل الميكروفون'); }
}
function stopDictation() { if (recog) { recog.onend = null; recog.stop(); recog = null; if (itemCtx()) render(); } }

/* Downscale photos so many fit in browser storage */
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1024; let { width: w, height: h } = img;
      if (w > max || h > max) { const r = Math.min(max / w, max / h); w = Math.round(w * r); h = Math.round(h * r); }
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(cv.toDataURL('image/jpeg', 0.7));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(); };
    img.src = url;
  });
}
async function addPhotos(files) {
  const ctx = itemCtx(); if (!ctx || !files.length) return;
  for (const f of files) {
    try {
      const data = await compressImage(f);
      ctx.s.photos.push(data);
      if (!persist()) { ctx.s.photos.pop(); break; }
    } catch (e) { toast('تعذر قراءة الصورة'); }
  }
  selPhoto = ctx.s.photos.length - 1;
  render();
}
$('#camInput').addEventListener('change', (e) => { addPhotos([...e.target.files]); e.target.value = ''; });
$('#galInput').addEventListener('change', (e) => { addPhotos([...e.target.files]); e.target.value = ''; });
$('#pdfInput').addEventListener('change', (e) => {
  const f = e.target.files[0]; e.target.value = '';
  const ctx = itemCtx(); if (!f || !ctx) return;
  const add = (data) => {
    ctx.s.files.push({ name: f.name, data });
    if (!persist()) { ctx.s.files.pop(); ctx.s.files.push({ name: f.name, data: null }); persist(); }
    render();
  };
  if (f.size > 1.5 * 1024 * 1024) { toast('الملف كبير – سيتم حفظ الاسم فقط كمرجع'); add(null); return; }
  const r = new FileReader(); r.onload = () => add(r.result); r.readAsDataURL(f);
});

        <div><dt>المنفذ</dt><dd>${esc(cl.technician || '—')}</dd></div>
        <div><dt>النتيجة</dt><dd class="${ok ? 'ok-text' : 'warn-text'}">${ok ? 'تمت بنجاح' : `غير مكتملة (${st.done}/${st.total})`}</dd></div>
        <div><dt>عدد البنود</dt><dd>${st.total}${st.skipped ? ` <small style="color:var(--amber)">· ${st.skipped} تم تخطيها</small>` : ''}</dd></div>
      </dl>
      <div class="summary-notes">
        <label class="field-label" for="gnotes">الملاحظات العامة</label>
        <textarea id="gnotes" placeholder="مثال: جميع الأنظمة جاهزة للتشغيل التجريبي.">${esc(cl.notes)}</textarea>
      </div>
      <button class="btn block" style="margin-top:14px" onclick="exportPdf()">${I.pdf}تصدير تقرير PDF</button>
      <div class="grid2">
        <button class="soft-btn" onclick="shareReport()">${I.share}مشاركة</button>
        <button class="soft-btn" onclick="saveAndExit()">${I.save}حفظ كملف</button>
      </div>
      <div class="grid2">
        <button class="soft-btn" onclick="go('/run/${cl.id}')">${I.list}مراجعة البنود</button>
        <button class="soft-btn" onclick="go('/')">${I.home}الرئيسية</button>
      </div>
    </div></section>`;
  $('#gnotes').addEventListener('input', (e) => { cl.notes = e.target.value; persist(); });
}
function reportText(cl) {
  const st = stats(cl); const ts = cl.completedAt || cl.startedAt;
  const lines = [titleOf(cl), 'Karbala Cement Plant – Delta Company', '',
    `القسم: ${sectionOf(cl.section).ar}`, `التاريخ: ${fmtDate(ts)} ${fmtTime(ts)}`, `المنفذ: ${cl.technician || '—'}`,
    `النتيجة: ${STATUS[cl.status].label} (${st.done}/${st.total})`, ''];
  buildGroups(sectionOf(cl.section)).forEach(g => {
    lines.push('■ ' + g.title);
    g.items.forEach(it => {
      const s = cl.items[it.id] || {};
      lines.push(`  ${s.state === 'done' ? '✔' : s.state === 'skipped' ? '↷' : '✘'} ${it.t}${s.note ? ' — ' + s.note : ''}`);
    });
  });
  if (cl.notes) lines.push('', 'الملاحظات العامة: ' + cl.notes);
  return lines.join('\n');
}
async function shareReport() {
  const cl = currentCl(); const text = reportText(cl);
  if (navigator.share) { try { await navigator.share({ title: titleOf(cl), text }); } catch (e) {} return; }
  try { await navigator.clipboard.writeText(text); toast('تم نسخ التقرير – يمكنك لصقه في أي تطبيق'); }
  catch (e) { toast('المشاركة غير مدعومة في هذا المتصفح'); }
}
function saveAndExit() {
  const cl = currentCl();
  const blob = new Blob(['﻿' + reportText(cl)], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `ColdRun_${sectionOf(cl.section).en.replace(/\W+/g, '_')}_${dayKey(cl.completedAt || cl.startedAt)}.txt`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('تم حفظ التقرير');
}
function exportPdf() {
  const cl = currentCl(); const st = stats(cl); const ts = cl.completedAt || cl.startedAt;
  const groups = buildGroups(sectionOf(cl.section));
  $('#print').innerHTML = `<div dir="rtl">
    <h1>${esc(titleOf(cl))}</h1><p class="sub">Karbala Cement Plant – Delta Company · Cold Run Checklist After Maintenance</p>
    <table><tr><th>القسم</th><td>${esc(sectionOf(cl.section).ar)} / ${esc(sectionOf(cl.section).en)}</td><th>التاريخ</th><td style="direction:ltr;text-align:right">${fmtDate(ts)} ${fmtTime(ts)}</td></tr>
    <tr><th>المنفذ</th><td>${esc(cl.technician || '—')}</td><th>النتيجة</th><td>${STATUS[cl.status].label} (${st.done}/${st.total})</td></tr></table>
    <table><tr><th style="width:28px">#</th><th>البند</th><th style="width:80px">الحالة</th><th>الملاحظات</th></tr>
    ${groups.map(g => `<tr class="grp"><td colspan="4">${esc(g.title)}</td></tr>` + g.items.map((it, i) => {
      const s = cl.items[it.id] || {};
      return `<tr><td>${i + 1}</td><td>${esc(it.t)}</td><td>${s.state === 'done' ? '✔ منجز' : s.state === 'skipped' ? 'تم التخطي' : '✘ غير منجز'}</td>
        <td>${esc(s.note || '')}${(s.files || []).length ? `<br><small>مرفقات: ${s.files.map(f => esc(f.name)).join('، ')}</small>` : ''}
        ${(s.photos || []).length ? `<div class="photos">${s.photos.map(p => `<img src="${p}">`).join('')}</div>` : ''}</td></tr>`;
    }).join('')).join('')}</table>
    ${cl.notes ? `<p><b>الملاحظات العامة:</b> ${esc(cl.notes)}</p>` : ''}
    <div class="sign"><div>توقيع الفني المنفذ</div><div>توقيع مشرف الوردية</div></div></div>`;
  toast('اختر "حفظ كـ PDF" من نافذة الطباعة');
  setTimeout(() => window.print(), 300);
}
function printBlank(sectionId) {
  const s = sectionOf(sectionId); closeOverlay();
  $('#print').innerHTML = `<div dir="rtl"><h1>قائمة فحص ${esc(s.ar)} (Cold Run)</h1><p class="sub">Karbala Cement Plant – Delta Company · ${esc(s.en)}</p>
    <table><tr><th>التاريخ</th><td style="width:35%"></td><th>المنفذ</th><td style="width:35%"></td></tr></table>
    <table><tr><th style="width:28px">#</th><th>البند</th><th style="width:50px">✔</th><th style="width:40%">الملاحظات</th></tr>
    ${buildGroups(s).map(g => `<tr class="grp"><td colspan="4">${esc(g.title)}</td></tr>` + g.items.map((it, i) => `<tr><td>${i + 1}</td><td>${esc(it.t)}</td><td></td><td></td></tr>`).join('')).join('')}</table>
    <div class="sign"><div>توقيع الفني المنفذ</div><div>توقيع مشرف الوردية</div></div></div>`;
  setTimeout(() => window.print(), 200);
}

/* ---------- History ---------- */
const filters = { q: '', section: '', from: '', to: '', status: '' };
function filtered() {
  const q = filters.q.trim().toLowerCase();
  return db.checklists.filter(c => {
    const s = sectionOf(c.section); const d = dayKey(c.completedAt || c.startedAt);
    if (q && !(titleOf(c) + ' ' + s.en + ' ' + (c.technician || '') + ' ' + fmtDate(c.completedAt || c.startedAt)).toLowerCase().includes(q)) return false;
    if (filters.section && c.section !== filters.section) return false;
    if (filters.status && c.status !== filters.status) return false;
    if (filters.from && d < filters.from) return false;
    if (filters.to && d > filters.to) return false;
    return true;
  });
}
function renderHistory() {
  const active = filters.section || filters.from || filters.to || filters.status;
  app.innerHTML = `<section class="screen">${topbar('القوائم السابقة', '/')}
    <div class="content">
      <div class="search">
        <div class="box"><input type="search" id="q" placeholder="بحث..." value="${esc(filters.q)}">${I.search}</div>
        <button class="filter-btn ${active ? 'active' : ''}" aria-label="تصفية" onclick="openFilter()">${I.filter}</button>
      </div>
      <div class="list" id="hlist"></div>
    </div></section>`;
  const q = $('#q');
  q.addEventListener('input', () => { filters.q = q.value; drawHistoryList(); });
  drawHistoryList();
}
function drawHistoryList() {
  const list = filtered();
  $('#hlist').innerHTML = list.length ? list.map(c => {
    const ts = c.completedAt || c.startedAt; const b = STATUS[c.status];
    return `<button class="hcard" onclick="go('${c.status === 'progress' ? '/run/' : '/summary/'}${c.id}')">
      <span class="txt"><b>${esc(titleOf(c))}</b><small>${fmtDate(ts)} &nbsp; ${fmtTime(ts)}</small></span>
      <span class="badge ${b.cls}">${b.label}</span></button>`;
  }).join('') : `<div class="empty">${I.list}${db.checklists.length ? 'لا توجد نتائج مطابقة' : 'لا توجد قوائم سابقة بعد.<br>ابدأ قائمة فحص جديدة من الصفحة الرئيسية.'}</div>`;
}
function openFilter() {
  const o = sheet('تصفية القوائم السابقة', `
    <div class="form-field"><label class="field-label" for="fSec">القسم</label>
      <select id="fSec"><option value="">جميع الأقسام</option>${SECTIONS.map(s => `<option value="${s.id}" ${filters.section === s.id ? 'selected' : ''}>${s.ar}</option>`).join('')}</select></div>
    <div class="form-field"><label class="field-label" for="fFrom">من تاريخ</label><input type="date" id="fFrom" value="${filters.from}"></div>
    <div class="form-field"><label class="field-label" for="fTo">إلى تاريخ</label><input type="date" id="fTo" value="${filters.to}"></div>
    <div class="form-field"><label class="field-label" for="fSt">الحالة</label>
      <select id="fSt"><option value="">جميع الحالات</option>${Object.entries(STATUS).map(([k, v]) => `<option value="${k}" ${filters.status === k ? 'selected' : ''}>${v.label}</option>`).join('')}</select></div>
    <button class="btn block" style="margin-top:18px" id="fApply">عرض النتائج</button>
    <button class="btn ghost block" style="margin-top:10px" id="fReset">إعادة تعيين</button>`);
  o.querySelector('#fApply').onclick = () => {
    filters.section = $('#fSec').value; filters.from = $('#fFrom').value; filters.to = $('#fTo').value; filters.status = $('#fSt').value;
    closeOverlay(); render();
  };
  o.querySelector('#fReset').onclick = () => { Object.assign(filters, { section: '', from: '', to: '', status: '' }); closeOverlay(); render(); };
}

/* ---------- Settings ---------- */
function renderSettings() {
  let used = 0; try { used = (localStorage.getItem(KEY) || '').length; } catch (e) {}
  app.innerHTML = `<section class="screen settings">${topbar('الإعدادات', '/')}
    <div class="content">
      <div class="card"><h4>اسم الفني المنفذ</h4><p>يظهر في تقارير الفحص الجديدة.</p>
        <input type="text" id="tech" value="${esc(db.technician)}" placeholder="أدخل الاسم"></div>
      <div class="card"><h4>البيانات المحفوظة</h4>
        <p>${db.checklists.length} قائمة محفوظة على هذا الجهاز · ${(used / 1024 / 1024).toFixed(2)} MB تقريبًا</p>
        <button class="btn danger block" onclick="clearAll()" ${db.checklists.length ? '' : 'disabled'}>حذف جميع القوائم</button></div>
      <div class="card"><h4>حول التطبيق</h4><p style="margin:0">Cold Run Checklist After Maintenance<br>Karbala Cement Plant – Delta Company<br>البيانات تُحفظ محليًا في المتصفح على هذا الجهاز فقط.</p></div>
    </div></section>`;
  $('#tech').addEventListener('input', (e) => { db.technician = e.target.value.trim(); persist(); });
}
function clearAll() {
  confirmBox('حذف جميع القوائم', 'سيتم حذف جميع قوائم الفحص والصور المحفوظة نهائيًا. لا يمكن التراجع.', 'حذف الكل', () => {
    db.checklists = []; persist(); render(); toast('تم حذف جميع القوائم');
  }, true);
}

/* ======================= Router ======================= */
function render() {
  const h = location.hash.replace(/^#/, '') || '/';
  const p = h.split('/').filter(Boolean);
  if (p[0] === 'sections') return renderSections();
  if (p[0] === 'history') return renderHistory();
  if (p[0] === 'settings') return renderSettings();
  if (p[0] === 'run' || p[0] === 'summary') {
    const cl = getCl(p[1]);
    if (!cl) { go('/'); return; }
    if (p[0] === 'summary') return renderSummary(cl);
    if (p[2] === 'item') return renderItem(cl, p[3]);
    return renderRun(cl);
  }
  renderHome();
}
let lastRoute = '';
window.addEventListener('hashchange', () => {
  if (!location.hash.includes('/item/')) stopDictation();
  closeOverlay();
  const route = location.hash.split('/').slice(0, 3).join('/');
  render();
  if (route !== lastRoute) window.scrollTo(0, 0);
  lastRoute = route;
});
render();
</script>
</body>
</html>
