<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KCML Cold Run Readiness has moved</title>
<meta http-equiv="refresh" content="0; url=https://kcml-coldrun.web.app/">
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, "Segoe UI", Tahoma, sans-serif;
    background: linear-gradient(160deg, #0b2a5b, #164a9a 60%, #0b2a5b); color: #fff; text-align: center; padding: 16px; }
  a { color: #fff; font-weight: 700; }
  p { color: #c7d6f3; }
</style>
</head>
<body>
<main>
  <h1>KCML Cold Run Readiness</h1>
  <p>The platform has moved to <a id="to" href="https://kcml-coldrun.web.app/">kcml-coldrun.web.app</a></p>
  <p dir="rtl">انتقلت المنصة إلى العنوان الجديد <a href="https://kcml-coldrun.web.app/">kcml-coldrun.web.app</a></p>
</main>
<script>
  // Keep the page the person asked for, and retire the old offline copy of the app on this address.
  var to = 'https://kcml-coldrun.web.app' + location.pathname + location.search + location.hash;
  document.getElementById('to').href = to;
  Promise.resolve()
    .then(function () { return navigator.serviceWorker ? navigator.serviceWorker.getRegistrations() : []; })
    .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })
    .then(function () { return window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }) : null; })
    .catch(function () {})
    .then(function () { location.replace(to); });
</script>
</body>
</html>
