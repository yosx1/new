# Builds the Cold Run platform and publishes it to Firebase Hosting (plus Firestore rules & indexes).
# Runs on every push to main that touches platform/, or manually from the Actions tab.
# One-time setup: see platform/README.md → "Automatic deployment from GitHub".
name: Deploy platform to Firebase

on:
  push:
    branches: [main]
    paths: ['platform/**', '.github/workflows/firebase-deploy.yml']
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    env:
      # Web app config (Firebase console → Project settings → Your apps). These are not secret,
      # but keeping them in repository secrets avoids committing project details.
      VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_PROJECT_ID }}.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - name: Check secrets
        run: |
          for v in FIREBASE_SERVICE_ACCOUNT FIREBASE_PROJECT_ID FIREBASE_API_KEY FIREBASE_APP_ID; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository secret $v (see platform/README.md)"; exit 1; fi
          done
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      - run: npm ci
      - run: npm run build
      - name: Deploy hosting, Firestore rules and indexes
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx firebase deploy --only hosting,firestore:rules,firestore:indexes --project "$PROJECT_ID" --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
          echo "### Deployed: https://$PROJECT_ID.web.app" >> "$GITHUB_STEP_SUMMARY"
